openapi: 3.1.0
info:
  title: EUDI Wallet Relying Party Registrar Write-methods API
  version: v0.1.1
servers:
  - url: 'https://example.com/registrar'
components:
  schemas:
    WalletRelyingParty:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/WalletRelyingParty'
    ProvidedAttestation:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/ProvidedAttestation'
    Claim:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/Claim'
    Credential:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/Credential'
    Identifier:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/Identifier'
    IntendedUse:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/IntendedUse'
    Law:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/Law'
    LegalEntity:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/LegalEntity'
    LegalPerson:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/LegalPerson'
    MetaType:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/MetaType'
    MultiLangString:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/MultiLangString'
    NaturalPerson:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/NaturalPerson'
    Policy:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/Policy'
    Provider:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/Provider'
    ServiceReference:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/ServiceReference'
    SupervisoryAuthority:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/SupervisoryAuthority'
    TrustAuthority:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/TrustAuthority'
    WalletRelyingPartyService:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/WalletRelyingPartyService'
    WalletRelyingPartySchema:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/WalletRelyingPartySchema'
    SignedWRP:
      $ref: './ts5-openapi31-registrar-api.yml#/components/schemas/SignedWRP'
paths:
  /wrp:
    post:
      summary: Create a new Wallet Relying Party
      description: Atomic creation method for registering a new Wallet Relying Party object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRelyingParty'
      responses:
        '201':
          description: Successfully created Wallet Relying Party as a JWS-signed object
          headers:
            x-jku-url:
              schema:
                type: string
                format: uri
          content:
            application/jwt:
              schema:
                type: string
                format: JWS
        '400':
          description: Invalid request payload (e.g., malformed JSON or validation failure)
        '409':
          description: Conflict. A Wallet Relying Party with this identifier already exists.
  /wrp/{identifier}:
    put:
      summary: Update an existing Wallet Relying Party
      description: Atomic update method for managing wrp objects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRelyingParty'
      responses:
        '200':
          description: Successfully updated Wallet Relying Party as a JWS-signed object
          headers:
            x-jku-url:
              schema:
                type: string
                format: uri
          content:
            application/jwt:
              schema:
                type: string
                format: JWS
        '400':
          description: Invalid request payload
        '404':
          description: Resource does not exist
    delete:
      summary: Delete a Wallet Relying Party by identifier
      description: Atomic WRP delete method. The whole WRP object will be deleted.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: Wallet Relying Party identifier (exact WalletRelyingParty.Identifier.identifier match)
      responses:
        '204':
          description: Wallet Relying Party successfully deleted
        '404':
          description: The resource does not exist
  /wrp/{identifier}/services:
    post:
      summary: Create a new Wallet Relying Party Service
      description: Registers a new WalletRelyingPartyService object bound to the parent Wallet Relying Party record matching '{identifier}'.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The parent unique identifier of the Wallet Relying Party
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRelyingPartyService'
      responses:
        '201':
          description: Successfully created WalletRelyingPartyService object instance as a JWS-signed object
          headers:
            x-jku-url:
              description: JWKS verification endpoint
              schema:
                type: string
                format: uri
          content:
            application/jwt:
              schema:
                type: string
                format: JWS
        '400':
          description: Invalid request payload
        '404':
          description: The parent Wallet Relying Party resource does not exist
        '409':
          description: Conflict. A service with this service identifier already exists under this Wallet Relying Party.
  /wrp/{identifier}/services/{serviceIdentifier}:  
    put:
      summary: Update Wallet Relying Party Service payload bound to a specific registered Service Identifier
      description: |
        Updates the WalletRelyingPartyService object of the parent Wallet Relying Party record matching the '{identifier}' and service identifier matching the provided '{serviceIdentifier}'.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The parent unique identifier of the Wallet Relying Party
        - in: path
          name: serviceIdentifier
          required: true
          schema:
            type: string
          description: The specific service identifier lookup key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRelyingPartyService'
      responses:
        '200':
          description: Successfully updated WalletRelyingPartyService object instance as a JWS-signed object
          headers:
            x-jku-url:
              description: JWKS verification endpoint
              schema:
                type: string
                format: uri
          content:
            application/jwt:
              schema:
                type: string
                format: JWS
        '400':
          description: Invalid request payload
        '404':
          description: The resource does not exist
    delete:
      summary: Delete a Wallet Relying Party Service by service identifier
      description: Atomic WRP Service delete method.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The parent unique identifier of the Wallet Relying Party
        - in: path
          name: serviceIdentifier
          required: true
          schema:
            type: string
          description: service identifier of the Wallet Relying Party Service to be deleted
      responses:
        '204':
          description: Wallet Relying Party Service successfully deleted
        '404':
          description: The resource does not exist