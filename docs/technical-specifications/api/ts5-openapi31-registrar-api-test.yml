openapi: 3.1.0
info:
  title: EUDI Wallet Relying Party Registrar API (Cleartext/JSON)
  version: v1.6
servers:
  - url: 'https://example.com/registrar'
components:
  schemas:
    WalletRelyingParty:
      $ref: '#/components/schemas/WalletRelyingPartySchema'
    ProvidedAttestation:
      type: object
      properties:
        format:
          type: string
        type:
          type: string
        trustAuthorities:
          type: array
          items:
            $ref: '#/components/schemas/TrustAuthority'
          minItems: 0
    Claim:
      type: object
      properties:
        path:
          type: array
          minItems: 1
          description: A non-empty array of strings, nulls, and non-negative integers representing the OpenID4VP claims path pointer.
          items:
            oneOf:
              - type: string
              - type: integer
                minimum: 0
              - type: "null"
    Credential:
      type: object
      properties:
        format:
          type: string
        meta:
          $ref: '#/components/schemas/MetaType'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
          minItems: 1
    Identifier:
      type: object
      properties:
        identifier:
          type: string
          description: The actual identifier value
          example: "FIFPRO.1234567-8"
        type:
          type: string
          format: uri
          description: The type of identifier aligned with the admissible identifier type URIs defined in TS2
          enum:
            - "http://data.europa.eu/eudi/id/EORI-No"
            - "http://data.europa.eu/eudi/id/LEI"
            - "http://data.europa.eu/eudi/id/EUID"
            - "http://data.europa.eu/eudi/id/VATIN"
            - "http://data.europa.eu/eudi/id/TIN"
            - "http://data.europa.eu/eudi/id/Excise"
          example: "http://data.europa.eu/eudi/id/EUID"
    IntendedUse:
      type: object
      properties:
        purpose:
          type: array
          items:
            $ref: '#/components/schemas/MultiLangString'
          minItems: 1
        privacyPolicy:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          minItems: 1
        intendedUseIdentifier:
          type: string
        createdAt:
          type: string
        revokedAt:
          type: string
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
          minItems: 1
    Law:
      type: object
      properties:
        legislativeIdentifier:
          type: string
        legalBasis:
          type: array
          items:
            type: string
          minItems: 0
    LegalEntity:
      type: object
      properties:
        country:
          type: string
          pattern: '^[A-Z]{2}$' # For ISO 3166-1 alpha-2
          example: "FI"
        email:
          type: array
          items:
            type: string
            format: email
            example: "support@example.com"
          minItems: 0
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          minItems: 1
        infoURI:
          type: array
          items:
            type: string
            format: uri
          minItems: 0
        legalPerson:
          $ref: '#/components/schemas/LegalPerson'
        naturalPerson:
          $ref: '#/components/schemas/NaturalPerson'
        phone:
          type: array
          items:
            type: string
            format: tel
            pattern: '^\+?[1-9]\d{1,14}$' # Standard RFC 3966 / E.164 phone format enforcement
            example: "+358401234567"
          minItems: 0
        postalAddress:
          type: array
          items:
            type: string
          minItems: 0
    LegalPerson:
      type: object
      properties:
        establishedByLaw:
          type: array
          items:
            $ref: '#/components/schemas/Law'
          minItems: 0
        legalName:
          type: array
          items:
            type: string
          minItems: 1
    MetaType:
      type: object
      description: An object defining additional properties requested by the Verifier. Exactly one of 'vct_values' or 'doctype_value' SHALL be present.
      properties:
        vct_values:
          type: array
          items:
            type: string
          description: Array of 'vct' values used for Credentials in SD-JWT VC format.
        doctype_value:
          type: string
          description: The 'doctype' string used for Credentials in ISO mdoc format.
    MultiLangString:
      type: object
      properties:
        lang:
          type: string
        content:
          type: string
    NaturalPerson:
      type: object
      properties:
        dateOfBirth:
          type: string
        familyName:
          type: string
        givenName:
          type: string
        placeOfBirth:
          type: string
    Policy:
      type: object
      properties:
        policyURI:
          type: string
          format: uri
        type:
          type: string
    Provider:
      type: object
      properties:
        policy:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          minItems: 1
        providerType:
          type: string
        x5c:
          type: array
          items:
            type: string
          minItems: 0
    ServiceReference:
      type: object
      required:
        - identifier
        - serviceIdentifier
        - registryURI
      properties:
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
          minItems: 1
        serviceIdentifier:
          type: string
          description: The locally unique service identifier assigned by the WRP.
        registryURI:
          type: string
          format: uri
    SupervisoryAuthority:
      type: object
      properties:
        country:
          type: string
          pattern: '^[A-Z]{2}$' # For ISO 3166-1 alpha-2, or use '^[A-Z]{2,3}$' if alpha-3 is permitted
          example: "FI" 
        email:
          type: array
          items:
            type: string
            format: email
            example: "support@example.com"
          minItems: 0
        formURI:
          type: array
          items:
            type: string
            format: uri
          minItems: 0
        name:
          type: string
        phone:
          type: array
          items:
            type: string
            format: tel
            pattern: '^\+?[1-9]\d{1,14}$' # Standard RFC 3966 / E.164 phone format enforcement
            example: "+358401234567"
          minItems: 0
      anyOf:
        - required: [email]
        - required: [phone]
        - required: [formURI]
    TrustAuthority:
      title: TrustAuthority
      description: Applicable trust model/framework type and identifier for attestation type.
      type: object
      properties:
        frameworkType:
          description: Trust framework type from OID4VP Section 6.1.1.
          type: string
          enum: [aki, etsi_tl, openid_federation]
        value:
          description: base64url or uri-formatted identifier according to the type.
          type: string
        isLOTE:
          description: optional boolean value that is set TRUE when the applicable trust framework type is an ETSI Trusted List (etsi_tl) but the trusted list behind the value URI is a list of trusted entities (LoTE).
          type: boolean
      required: [frameworkType, value]
      additionalProperties: false
    WalletRelyingPartyService:
      type: object
      properties:
        serviceTradeName:
          type: string
        serviceIdentifier:
          type: string
        supportURI:
          type: string
          format: uri
        email:
          type: string
          format: email
          example: "support@example.com"
        phone:
          type: string
          format: tel
          pattern: '^\+?[1-9]\d{1,14}$' # Standard RFC 3966 / E.164 phone format enforcement
          example: "+358401234567"
        srvDescription:
          type: array
          items:
            $ref: '#/components/schemas/MultiLangString'
          minItems: 1
        intendedUses:
          type: array
          items:
            $ref: '#/components/schemas/IntendedUse'
          minItems: 0
        entitlements:
          type: array
          items:
            type: string
          minItems: 0
        subEntitlements:
          type: array
          items:
            type: string
          minItems: 0  
        providesAttestations:
          type: array
          items:
            $ref: '#/components/schemas/ProvidedAttestation'
          minItems: 0
        issuerPolicies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          minItems: 0  
        usesIntermediaries:
          type: array
          items:
            $ref: '#/components/schemas/ServiceReference'
          minItems: 0
        isIntermediary:
          type: boolean
        servedWRPServices:
          type: array
          items:
            $ref: '#/components/schemas/ServiceReference'
          minItems: 0
      anyOf:
        - required: [supportURI]
        - required: [email]
        - required: [phone]
      allOf:
        - if:
            properties:
              isIntermediary:
                const: false
          then:
            properties:
              servedWRPServices:
                maxItems: 0
        - if:
            properties:
              usesIntermediaries:
                minItems: 1
          then:
            properties:
              isIntermediary:
                const: false
        - if:
            properties:
              providesAttestations:
                minItems: 1
          then:
            properties:
              entitlements:
                contains:
                  enum:
                    - "QEAA_Provider"
                    - "Non_Q_EAA_Provider"
                    - "PUB_EAA_Provider"
                    - "PID_Provider"
    WalletRelyingPartySchema:
      allOf:
        - $ref: '#/components/schemas/Provider'
        - type: object
          properties:
            isPSB:
              type: boolean
            supervisoryAuthority:
              $ref: '#/components/schemas/SupervisoryAuthority'
            tradeName:
              type: string
            registryURI:
              type: string
              format: uri
            createdAt:
              type: string
            revokedAt:
              type: string
            services:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/WalletRelyingPartyService'
    SignedWRP:
      type: object
      description: Cleartext wrapper response for single WRP queries.
      required:
        - iss
        - iat
        - data
      properties:
        iss:
          type: string
          description: 'Issuer, the identifier of the Registry.'
        iat:
          type: integer
          format: int64
          description: 'Issued At, the timestamp at which the payload was generated.'
        data:
          $ref: '#/components/schemas/WalletRelyingParty'
    SignedWRPArray:
      type: object
      description: Cleartext wrapper response for /wrp list queries.
      required:
        - iss
        - iat
        - data
      properties:
        iss:
          type: string
          description: 'Issuer, the identifier of the Registry.'
        iat:
          type: integer
          format: int64
          description: 'Issued At, the timestamp at which the payload was generated.'
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletRelyingParty'
        pagination:
          type: object
          properties:
            next_cursor:
              type: string
              description: The cursor to use to fetch the next page of results.
            has_next_page:
              type: boolean
              description: Whether there is a next page of results.
    SignedIntendedUseCheckResult:
      type: object
      description: Cleartext wrapper response for /wrp/check-intended-use queries.
      required:
        - iss
        - iat
        - data
      properties:
        iss:
          type: string
          description: 'Issuer, the identifier of the Registry'
        iat:
          type: integer
          format: int64
          description: 'Issued At, the timestamp at which the payload was generated'
        data:
          type: object
          properties:
            isRegistered:
              type: boolean
              description: True if specified attributes match registration data and 'revokedAt' value of the IntendedUse doesn't indicate revocation at time of query.
            details:
              type: string
paths:
  /wrp:
    get:
      summary: 'Get a list of Wallet Relying Parties (with optional filtering, isolation, and pagination)'
      description: Returns a list of matching Wallet Relying Parties in cleartext JSON.
      parameters:
        - in: query
          name: identifier
          schema:
            type: string
          description: Filter by Wallet-Relying Party identifier (exact WalletRelyingParty.Identifier.identifier match only)
        - in: query
          name: serviceIdentifier
          schema:
            type: string
          description: Filter by precise Service Identifier inside the WRPServices array (exact WalletRelyingPartyService.serviceIdentifier match only)
        - in: query
          name: isolateService
          schema:
            type: boolean
            default: false
          description: |
            If true, and a `serviceIdentifier` match is found, the backend will strip out all other non-matching service instances from the returned WRP objects in the `data` array.
        - in: query
          name: legalName
          schema:
            type: string
          description: Filter by registered legal name (case-insensitive substring match)
        - in: query
          name: tradeName
          schema:
            type: string
          description: Filter by WRP 'tradeName' or WalletRelyingPartyService 'serviceTradeName' (case-insensitive substring match of either)
        - in: query
          name: policy
          schema:
            type: string
            format: uri
          description: Filter by policy URI (matching exact Provider.policy, WalletRelyingParty.issuerPolicy and IntendedUse.privacyPolicy policyURIs)
        - in: query
          name: entitlement
          schema:
            type: string
            format: uri
          description: Filter by entitlement value (matching exact entitlement and/or subEntitlement URIs)
        - in: query
          name: providedAttestation
          schema:
            type: string
          description: Filter by provided attestation type (exact match only)
        - in: query
          name: credentialMeta
          schema:
            type: string
          description: Filter by credential -> meta object information (exact match of "vct" or "docType" value present in meta object)
        - in: query
          name: credentialFormat
          schema:
            type: string
          description: Filter by WRPs that have registered given credential format within their intended use (exact enumeration string match only)
        - in: query
          name: usesIntermediary
          schema:
            type: string
          description: Filter by intermediary service matching with given 'WalletRelyingPartyService.serviceIdentifier' string (exact match)
        - in: query
          name: isIntermediary
          schema:
            type: boolean
          description: Filter by WRPs that have registered as an intermediary (match with WalletRelyingPartyService.isIntermediary=true)
        - in: query
          name: intendedUseIdentifier
          schema:
            type: string
          description: Filter by registrar-assigned identifier of an intended use (exact IntendedUse.intendedUseIdentifier match only)
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: use limit-based pagination
        - name: cursor
          in: query
          schema:
            type: string
          description: use cursor-based pagination
      responses:
        '200':
          description: Cleartext list of matching Wallet Relying Party objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedWRPArray'
        '400':
          description: Invalid request payload
        '404':
          description: The resource does not exist
  /wrp/{identifier}:
    get:
      summary: Get Wallet Relying Party by identifier
      description: Method to retrieve a WRP object as cleartext JSON.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The identifier of the Wallet Relying Party to retrieve (exact WalletRelyingParty.Identifier.identifier match)
      responses:
        '200':
          description: Found Wallet Relying Party as cleartext JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedWRP'
        '404':
          description: The resource does not exist
  /wrp/{identifier}/services/{serviceidentifier}:
    get:
      summary: Get Wallet Relying Party payload isolated to a specific registered Service Identifier
      description: |
        Retrieves the parent Wallet Relying Party record matching the '{identifier}', but slices the `walletRelyingPartyService` array down so it returns ONLY the single service instance matching the provided '{serviceidentifier}'.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: The parent unique identifier of the Wallet Relying Party (exact match of WalletRelyingParty.Identifier.identifier)
        - in: path
          name: serviceIdentifier
          required: true
          schema:
            type: string
          description: The specific service identifier lookup key (exact WalletRelyingPartyService.serviceIdentifier)
      responses:
        '200':
          description: Found isolated parent record containing only the filtered service object instance in cleartext JSON format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedWRP'
        '404':
          description: The resource does not exist
  /wrp/check-intended-use:
    get:
      summary: Check if a specific intended use configuration is active 
      description: Provides a cleartext boolean `TRUE` or `FALSE` response object indicating whether the queried parameter set can be found in the Registrar's active `Intended use` information.
      parameters:
        - in: query
          name: identifier
          schema:
            type: string
          description: Filter by WRP identifier (exact match of WalletRelyingParty.Identifier.identifier)
        - in: query
          name: serviceIdentifier
          schema:
            type: string
          description: Service identification filter context (exact WalletRelyingPartyService.serviceIdentifier)
        - in: query
          name: intendedUseIdentifier
          schema:
            type: string
          description: Filter by intendedUseIdentifier (exact IntendedUse.intendedUseIdentifier match only)
        - in: query
          name: credentialFormat
          schema:
            type: string
          description: Filter intended uses by registered credential format (exact enumeration string match only)
        - in: query
          name: claimPath
          schema:
            type: string
          description: Filter by registered claim paths (exact Claim.path matches only)
        - in: query
          name: credentialMeta
          schema:
            type: string
          description: Filter by matching credential -> meta information (exact match of "vct" or "docType" string value present in Credential.meta object)
        - in: query
          name: policy
          schema:
            type: string
            format: uri
          description: Filter by registered privacy policy URI (exact IntendedUse.privacyPolicy policyURI match)
      responses:
        '200':
          description: Intended use check result as cleartext JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIntendedUseCheckResult'
        '400':
          description: Invalid request parameters